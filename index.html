<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-3 메뉴 조사</title>
<meta name="description" content="2026 원화중 3학년 3반 메뉴 조사">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #fff8ef;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #8a7b6c;
    --line: #eadfce;
    --accent: #ff7a1a;
    --accent-ink: #ffffff;
    --accent-soft: #fff0e2;
    --chicken: #f2a33a;
    --yeop: #e8362f;
    --ok: #1f9d55;
    --err: #d93025;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }
  header { text-align: center; margin: 8px 0 18px; }
  header .tag { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
  header h1 { font-size: 24px; font-weight: 900; margin: 10px 0 4px; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  .card { background: var(--card); border-radius: 20px; padding: 22px 18px; box-shadow: 0 6px 24px rgba(80,50,20,.08); }
  .step-label { font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .card h2 { font-size: 21px; margin: 0 0 16px; letter-spacing: -0.4px; }

  label.field { display: block; font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  input[type=text], input[type=tel] {
    width: 100%; font: inherit; font-size: 18px; padding: 14px 14px; border-radius: 14px;
    border: 2px solid var(--line); background: #fff; color: var(--ink); outline: none;
  }
  input:focus { border-color: var(--accent); }
  .field-gap { height: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--err); font-size: 14px; margin-top: 10px; min-height: 1em; }

  .options { display: grid; gap: 10px; }
  .options.two { grid-template-columns: 1fr 1fr; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font: inherit; font-size: 17px; font-weight: 500; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 15px 16px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .opt:active { transform: scale(.98); }
  .opt .check { font-size: 20px; line-height: 1; color: var(--accent); }
  .opt .emoji { font-size: 24px; line-height: 1; }
  .opt .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .opt.big { flex-direction: column; justify-content: center; text-align: center; padding: 26px 10px; font-size: 20px; font-weight: 900; }
  .opt.big .emoji { font-size: 44px; }
  .opt.big.chicken.selected { border-color: var(--chicken); background: #fff4e0; }
  .opt.big.yeop.selected { border-color: var(--yeop); background: #ffe9e7; }
  .other-input { margin-top: 10px; }

  .summary { border: 2px dashed var(--line); border-radius: 16px; padding: 6px 16px; }
  .summary .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .summary .row:last-child { border-bottom: none; }
  .summary .k { color: var(--muted); flex-shrink: 0; }
  .summary .v { font-weight: 700; text-align: right; word-break: keep-all; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, rgba(255,248,239,0)); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .bar .inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { font: inherit; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; padding: 16px; cursor: pointer; }
  .btn.primary { flex: 1; background: var(--accent); color: var(--accent-ink); }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); min-width: 92px; }

  .done { text-align: center; padding: 10px 0; }
  .done .big-emoji { font-size: 64px; }
  .done h2 { margin: 8px 0; }
  .done p { color: var(--muted); margin: 0 0 18px; line-height: 1.6; }
  .warn { background: #fff3cd; color: #7a5b00; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">2026 원화중 3-3</span>
    <h1>🍗 메뉴 조사 🌶️</h1>
    <p>순서대로 고르고 마지막에 제출하면 끝!</p>
  </header>
  <div class="progress"><div id="progress"></div></div>
  <div id="warn"></div>
  <main class="card" id="card"></main>
</div>
<div class="bar" id="bar"><div class="inner">
  <button class="btn ghost" id="back">이전</button>
  <button class="btn primary" id="next">다음</button>
</div></div>

<script>
/* ================== 설정 ================== */
// Apps Script 웹 앱 배포 후 받은 URL을 여기에 붙여 넣으세요.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTFZMPWJSTJRzMrixpiCqzd0ksnDUxGV7X8EQlt7-7knlbd1uSfNq0oaNpftC-LurN/exec";

const OTHER = "기타";
const BRANDS = ["멕시카나", "BHC", "BBQ", "굽네", "호식이"];
const CHICKEN_MENU = ["후라이드", "양념", "간장", OTHER];
const BONE = ["뼈", "순살", "상관없음"];
const DRINKS = ["콜라", "사이다", "제로콜라", "제로사이다"];
const COOLPIS = ["파인애플", "복숭아", "자두"];
const NONE = "없음";
const YEOP_TOP = [NONE, "치즈", "당면", "분모자", "메추리알", "소시지", "우삼겹", "오뎅"];
const YEOP_SIDE = [NONE, "주먹김밥", "계란찜", "모둠튀김", "순대"];
const MULTI = { flavors: CHICKEN_MENU, yTops: YEOP_TOP, ySides: YEOP_SIDE };
const YEOP_MENU = ["엽기떡볶이", "엽기오뎅", "엽기반반", "로제떡볶이", "마라떡볶이"];
const YEOP_SPICY = [
  ["착한맛", "거의 안 매움"], ["초보맛", "살짝 매움"], ["덜매운맛", "적당히 매움"],
  ["오리지널", "엽떡 기본 맛"], ["매운맛", "아주 매움"]
];

/* ================== 상태 ================== */
const blank = () => ({ id: "", name: "", party: "", brand: "", flavors: [], flavorOther: "", bone: "", drink: "", yMenu: "", ySpicy: "", yTops: [], ySides: [], yDrink: "" });
let S = blank();
let stepIdx = 0;
let submitting = false;
try { const saved = JSON.parse(localStorage.getItem("hoesik33") || "null"); if (saved) { S = Object.assign(blank(), saved); for (const k of Object.keys(MULTI)) if (!Array.isArray(S[k])) S[k] = []; } } catch (e) {}
const save = () => { try { localStorage.setItem("hoesik33", JSON.stringify(S)); } catch (e) {} };

function steps() {
  const base = ["who", "party"];
  if (S.party === "치킨") base.push("brand", "flavor", "bone", "drink");
  else if (S.party === "엽떡") base.push("yMenu", "ySpicy", "yTop", "ySide", "yDrink");
  base.push("confirm");
  return base;
}

/* ================== 렌더링 ================== */
const $card = document.getElementById("card");
const $next = document.getElementById("next");
const $back = document.getElementById("back");
const $bar = document.getElementById("bar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

if (!SCRIPT_URL) document.getElementById("warn").innerHTML = '<div class="warn">⚠️ 아직 제출 주소가 설정되지 않았어요. (선생님 설정 필요)</div>';

function optionList(items, key, cls = "") {
  return `<div class="options ${cls}">` + items.map(it => {
    const [label, sub] = Array.isArray(it) ? it : [it, ""];
    return `<button class="opt ${S[key] === label ? "selected" : ""}" data-key="${key}" data-val="${esc(label)}">
      <span>${esc(label)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span></button>`;
  }).join("") + `</div>`;
}

function render() {
  const list = steps();
  const step = list[stepIdx];
  const total = list.length;
  document.getElementById("progress").style.width = ((stepIdx + 1) / total * 100) + "%";
  const label = `STEP ${stepIdx + 1} / ${total}`;
  let html = "";

  if (step === "who") {
    html = `<div class="step-label">${label}</div><h2>누구인가요?</h2>
      <label class="field" for="id">학번 (5자리)</label>
      <input type="tel" id="id" inputmode="numeric" maxlength="5" value="${esc(S.id)}">
      <div class="field-gap"></div>
      <label class="field" for="name">이름</label>
      <input type="text" id="name" maxlength="10" value="${esc(S.name)}">
      <div class="hint">같은 학번으로 다시 제출하면 마지막 제출만 반영돼요.</div>
      <div class="error" id="err"></div>`;
  } else if (step === "party") {
    html = `<div class="step-label">${label}</div><h2>어느 파인가요?</h2>
      <div class="options two">
        <button class="opt big chicken ${S.party === "치킨" ? "selected" : ""}" data-key="party" data-val="치킨"><span class="emoji">🍗</span>치킨파</button>
        <button class="opt big yeop ${S.party === "엽떡" ? "selected" : ""}" data-key="party" data-val="엽떡"><span class="emoji">🌶️</span>엽떡파</button>
      </div>`;
  } else if (step === "brand") {
    html = `<div class="step-label">${label}</div><h2>치킨 브랜드를 골라요</h2>` + optionList(BRANDS, "brand");
  } else if (step === "flavor") {
    html = `<div class="step-label">${label}</div><h2>치킨 메뉴는?</h2><div class="hint" style="margin:-8px 0 14px">여러 개 골라도 돼요</div>
      <div class="options">` + CHICKEN_MENU.map(m => `<button class="opt ${S.flavors.includes(m) ? "selected" : ""}" data-key="flavors" data-val="${esc(m)}">
        <span class="check">${S.flavors.includes(m) ? "☑" : "☐"}</span><span>${esc(m)}</span></button>`).join("") + `</div>` +
      (S.flavors.includes(OTHER) ? `<input type="text" class="other-input" id="other" maxlength="30" placeholder="기타 메뉴를 입력하세요" value="${esc(S.flavorOther)}">` : "") +
      `<div class="error" id="err"></div>`;
  } else if (step === "bone") {
    html = `<div class="step-label">${label}</div><h2>뼈? 순살?</h2>` + optionList(BONE, "bone");
  } else if (step === "drink") {
    html = `<div class="step-label">${label}</div><h2>음료는?</h2>` + optionList(DRINKS, "drink", "two");
  } else if (step === "yMenu") {
    html = `<div class="step-label">${label}</div><h2>엽떡 메뉴는?</h2>` + optionList(YEOP_MENU, "yMenu");
  } else if (step === "ySpicy") {
    html = `<div class="step-label">${label}</div><h2>맵기는?</h2>` + optionList(YEOP_SPICY, "ySpicy");
  } else if (step === "yTop") {
    html = `<div class="step-label">${label}</div><h2>토핑 추가는?</h2><div class="hint" style="margin:-8px 0 14px">여러 개 골라도 돼요. 없으면 '없음'</div>` + multiList("yTops");
  } else if (step === "ySide") {
    html = `<div class="step-label">${label}</div><h2>사이드는?</h2><div class="hint" style="margin:-8px 0 14px">여러 개 골라도 돼요. 없으면 '없음'</div>` + multiList("ySides");
  } else if (step === "yDrink") {
    html = `<div class="step-label">${label}</div><h2>쿨피스 맛은?</h2>` + optionList(COOLPIS, "yDrink");
  } else if (step === "confirm") {
    const rows = [["학번", S.id], ["이름", S.name], ["파", S.party === "치킨" ? "🍗 치킨파" : "🌶️ 엽떡파"]];
    if (S.party === "치킨") rows.push(["브랜드", S.brand], ["메뉴", flavorText()], ["뼈/순살", S.bone], ["음료", S.drink]);
    else rows.push(["메뉴", S.yMenu], ["맵기", S.ySpicy], ["토핑 추가", S.yTops.join(", ")], ["사이드", S.ySides.join(", ")], ["음료", "쿨피스 " + S.yDrink]);
    html = `<div class="step-label">${label}</div><h2>이대로 제출할까요?</h2>
      <div class="summary">${rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>
      <div class="error" id="err"></div>`;
  }

  $card.innerHTML = html;
  $bar.style.display = "";
  $back.style.visibility = stepIdx === 0 ? "hidden" : "visible";
  $next.innerHTML = step === "confirm" ? "제출하기" : "다음";
  $next.disabled = !canNext(step);

  $card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.key, val = b.dataset.val;
    if (MULTI[key]) {
      const cur = S[key];
      if (cur.includes(val)) S[key] = cur.filter(x => x !== val);
      else if (val === NONE) S[key] = [NONE];
      else S[key] = MULTI[key].filter(m => m === val || (cur.includes(m) && m !== NONE));
      save(); render();
      if (val === OTHER && S.flavors.includes(OTHER)) { const o = document.getElementById("other"); o && o.focus(); }
      return;
    }
    S[key] = val;
    save();
    stepIdx++; render(); scrollTo(0, 0);
  }));
  const bindInput = (id, key, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("input", () => { S[key] = fn ? fn(el) : el.value; save(); $next.disabled = !canNext(step); }); };
  bindInput("id", "id", el => (el.value = el.value.replace(/\D/g, "").slice(0, 5)));
  bindInput("name", "name");
  bindInput("other", "flavorOther");
}

function multiList(key) {
  return `<div class="options">` + MULTI[key].map(m => `<button class="opt ${S[key].includes(m) ? "selected" : ""}" data-key="${key}" data-val="${esc(m)}">
    <span class="check">${S[key].includes(m) ? "☑" : "☐"}</span><span>${esc(m)}</span></button>`).join("") + `</div>`;
}
function yeopText() { return `${S.yMenu} / 추가: ${S.yTops.join(", ")} / 사이드: ${S.ySides.join(", ")}`; }
function flavorText() { return S.flavors.map(f => f === OTHER ? `기타(${S.flavorOther.trim()})` : f).join(", "); }

function canNext(step) {
  switch (step) {
    case "who": return /^\d{5}$/.test(S.id) && S.name.trim().length >= 2;
    case "party": return !!S.party;
    case "brand": return !!S.brand;
    case "flavor": return S.flavors.length > 0 && (!S.flavors.includes(OTHER) || S.flavorOther.trim().length > 0);
    case "bone": return !!S.bone;
    case "drink": return !!S.drink;
    case "yMenu": return !!S.yMenu;
    case "ySpicy": return !!S.ySpicy;
    case "yTop": return S.yTops.length > 0;
    case "ySide": return S.ySides.length > 0;
    case "yDrink": return !!S.yDrink;
    case "confirm": return !submitting;
  }
  return false;
}

$back.addEventListener("click", () => { if (stepIdx > 0) { stepIdx--; render(); } });
$next.addEventListener("click", async () => {
  const step = steps()[stepIdx];
  if (!canNext(step)) return;
  if (step === "who" && !/^3\d{4}$/.test(S.id)) {
    if (!confirm(`학번이 ${S.id} 맞나요?`)) return;
  }
  if (step === "confirm") return submit();
  stepIdx++; render(); scrollTo(0, 0);
});

async function submit() {
  const err = document.getElementById("err");
  if (!SCRIPT_URL) { err.textContent = "제출 주소가 아직 설정되지 않았어요. 선생님께 알려주세요."; return; }
  submitting = true;
  $next.disabled = true;
  $next.innerHTML = '<span class="spinner"></span>제출 중...';
  const payload = {
    id: S.id, name: S.name.trim(), party: S.party,
    brand: S.party === "치킨" ? S.brand : "",
    flavor: S.party === "치킨" ? flavorText() : "",
    bone: S.party === "치킨" ? S.bone : "",
    drink: S.party === "치킨" ? S.drink : "쿨피스 " + S.yDrink,
    yMenu: S.party === "엽떡" ? yeopText() : "",
    ySpicy: S.party === "엽떡" ? S.ySpicy : ""
  };
  const body = JSON.stringify(payload);
  let ok = false;
  try {
    const res = await fetch(SCRIPT_URL, { method: "POST", body });
    const data = await res.json();
    ok = !!data.ok;
    if (!ok) throw new Error(data.error || "unknown");
  } catch (e) {
    // CORS 응답을 읽지 못하는 환경 대비: no-cors로 한 번 더 전송 (학번 기준 덮어쓰기라 중복돼도 안전)
    try { await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body }); ok = true; } catch (e2) { ok = false; }
  }
  submitting = false;
  if (ok) return showDone();
  render();
  document.getElementById("err").textContent = "제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
}

function showDone() {
  document.getElementById("progress").style.width = "100%";
  $bar.style.display = "none";
  const what = S.party === "치킨" ? `${S.brand} ${flavorText()} (${S.bone}) + ${S.drink}` : `${S.yMenu} ${S.ySpicy} / 추가: ${S.yTops.join(", ")} / 사이드: ${S.ySides.join(", ")} / 쿨피스 ${S.yDrink}`;
  $card.innerHTML = `<div class="done"><div class="big-emoji">${S.party === "치킨" ? "🍗" : "🌶️"}</div>
    <h2>제출 완료!</h2>
    <p><b>${esc(S.id)} ${esc(S.name)}</b><br>${esc(what)}<br><br>바꾸고 싶으면 다시 제출하면 돼요.<br>마지막 제출만 반영됩니다.</p>
    <button class="btn ghost" id="again" style="width:100%">다시 고르기</button></div>`;
  document.getElementById("again").addEventListener("click", () => { stepIdx = 1; render(); scrollTo(0, 0); });
}

render();
</script>
</body>
</html>
